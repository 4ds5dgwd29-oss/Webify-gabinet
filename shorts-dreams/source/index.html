<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Gelasio;font-style:italic;font-weight:400;src:url(fonts/gelasio-latin-400-italic.woff2)}
@font-face{font-family:Gelasio;font-style:italic;font-weight:700;src:url(fonts/gelasio-latin-700-italic.woff2)}
@font-face{font-family:Archivo;font-weight:500;src:url(fonts/archivo-latin-500-normal.woff2)}
@font-face{font-family:Archivo;font-weight:700;src:url(fonts/archivo-latin-700-normal.woff2)}
@font-face{font-family:Archivo;font-weight:900;src:url(fonts/archivo-latin-900-normal.woff2)}
@font-face{font-family:DMSerif;font-weight:400;src:url(fonts/dm-serif-display-latin-400-normal.woff2)}
html,body{margin:0;padding:0;background:#000;width:1080px;height:1920px;overflow:hidden}
#wrap{position:relative;width:1080px;height:1920px;overflow:hidden}
#c{position:absolute;inset:0;width:1080px;height:1920px}
#ui,#lines{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none}
#ui *{box-sizing:border-box}
.hud{position:absolute;top:150px;color:#fff;font-family:Archivo;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hud.tl{left:66px}.hud.tr{right:66px;text-align:right}
.lbl{font-family:Archivo;font-weight:700;font-size:22px;letter-spacing:.22em;color:rgba(255,255,255,.88)}
.stage{font-family:DMSerif;font-size:96px;line-height:1;margin-top:6px}
.state{font-weight:900;font-size:54px;line-height:1.05;margin-top:8px;letter-spacing:.04em}
.state.hot{color:#ff7d6e}
.clk{margin-top:8px}
.title{position:absolute;left:0;right:0;text-align:center;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.tsub{font-family:Archivo;font-weight:700;font-size:24px;letter-spacing:.3em;opacity:.85}
.tmain{font-family:DMSerif;font-size:76px;line-height:1.04;margin-top:12px;padding:0 70px}
.chip{position:absolute;left:0;top:0;padding:14px 26px;border-radius:999px;background:rgba(12,10,40,.6);border:1.5px solid rgba(255,255,255,.28);color:#fff;font-family:Archivo;font-weight:700;font-size:25px;letter-spacing:.14em;white-space:nowrap;backdrop-filter:blur(8px)}
.chip.hot{border-color:#ff7d6e;color:#ffd1cb}
.chip.cool{border-color:#7fe3ff;color:#d6f6ff}
.chip.good{border-color:#7ff0b0;color:#d9ffe9}
.chip.big{font-size:30px;padding:18px 32px}
.panel{position:absolute;left:0;top:0;padding:22px 26px;border-radius:24px;background:rgba(10,10,38,.58);border:1.5px solid rgba(255,255,255,.2);color:#fff;font-family:Archivo;backdrop-filter:blur(10px)}
.panel .row{display:flex;justify-content:space-between;align-items:baseline}
.panel .val{font-weight:900;font-size:34px;letter-spacing:.02em}
.bar{height:12px;border-radius:8px;background:rgba(255,255,255,.14);margin-top:12px;overflow:hidden}
.bar.big{height:22px}
.bar i{display:block;height:100%;border-radius:8px}
.check .head{margin-bottom:12px}
.check .it{display:flex;align-items:center;gap:18px;font-weight:700;font-size:31px;margin:12px 0}
.check b{width:40px;height:40px;border-radius:12px;border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;color:#0b1430;font-size:26px;flex:none}
.prog .status{margin-top:14px;font-weight:900;font-size:34px;letter-spacing:.08em}
.callout{position:absolute;left:0;top:0;padding:12px 22px;border-radius:16px;background:rgba(10,10,38,.62);border:1.5px solid #fff;color:#fff;font-family:Archivo;text-align:center;white-space:nowrap;backdrop-filter:blur(8px)}
.callout .cl{font-weight:900;font-size:30px;letter-spacing:.1em}
.callout .cs{font-weight:700;font-size:20px;letter-spacing:.2em;opacity:.8;margin-top:4px}
.lead{stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.sub{position:absolute;left:520px;top:1236px;width:900px;transform:translateX(-50%);text-align:center;color:#fff;font-family:Gelasio;font-style:italic;font-size:64px;line-height:1.22;text-shadow:0 3px 22px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.5)}
.sub span{transition:none}
.fade{position:absolute;inset:0;opacity:0}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%),linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,0) 18%,rgba(0,0,0,0) 58%,rgba(0,0,0,.38) 78%,rgba(0,0,0,.15))}
</style></head>
<body><div id="wrap"><canvas id="c" width="1080" height="1920"></canvas><div id="fadeEl" class="fade"></div><div class="vign"></div><svg id="lines" viewBox="0 0 1080 1920"></svg><div id="ui"></div></div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module" src="main.js"></script>
</body></html>
